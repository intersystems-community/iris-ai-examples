[mcp]
transport  = "http"
host       = "0.0.0.0"
port       = 8888
base_route = "/mcp"

[[iris]]
name = "careconnect"
server = { host = "localhost", port = 1972, username = "_SYSTEM", password = "SYS" }
pool   = { min = 1, max = 3 }
endpoints = [
  { path = "/mcp/careconnect" },
]
tool_refresh_interval_secs = 30
tool_timeout_secs          = 120
reconnect_interval_secs    = 10
