services:
  iris:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: careconnect-iris
    ports:
      - "1972:1972"
      - "52773:52773"
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/1972"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: careconnect-mcp
    entrypoint: ["/usr/irissys/bin/iris-mcp-server"]
    command: ["run",
              "--iris-host", "localhost",
              "--iris-port", "1972",
              "--iris-user", "_SYSTEM",
              "--iris-password", "SYS",
              "--iris-endpoint", "/mcp/careconnect"]
    network_mode: "service:iris"
    ports:
      - "8888:8888"
    depends_on:
      iris:
        condition: service_healthy
