services:
  iris:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: careconnect-iris
    ports:
      - "${IRIS_PORT:-1972}:1972"
      - "${IRIS_WEB_PORT:-52773}:52773"
      - "${MCP_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/1972 && cat < /dev/null > /dev/tcp/localhost/52773"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: careconnect-mcp
    entrypoint: ["/usr/irissys/bin/iris-mcp-server"]
    command: ["--config", "/etc/iris-mcp/mcp-config.toml", "run"]
    network_mode: "service:iris"
    volumes:
      - ./mcp-config.toml:/etc/iris-mcp/mcp-config.toml:ro
    depends_on:
      iris:
        condition: service_healthy
