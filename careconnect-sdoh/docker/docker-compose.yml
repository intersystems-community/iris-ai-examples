services:
  iris:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: careconnect-iris
    ports:
      - "${IRIS_PORT:-1972}:1972"
      - "${IRIS_WEB_PORT:-52773}:52773"
      - "${MCP_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,base64,sys; req=urllib.request.Request('http://localhost:52773/mcp/careconnect/v1/services'); req.add_header('Authorization','Basic '+base64.b64encode(b'_SYSTEM:SYS').decode()); r=urllib.request.urlopen(req,timeout=5); d=r.read(); sys.exit(0 if b'name' in d else 1)"]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 120s

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: careconnect-mcp
    entrypoint: ["/usr/irissys/bin/iris-mcp-server"]
    command: ["--config", "/etc/iris-mcp/mcp-config.toml", "run"]
    network_mode: "service:iris"
    volumes:
      - ./mcp-config.toml:/etc/iris-mcp/mcp-config.toml:ro
    depends_on:
      iris:
        condition: service_healthy
