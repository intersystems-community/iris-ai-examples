## CareConnect phi_guardian configuration
## HIPAA Safe Harbor identifiers (45 CFR §164.514(b)(2)) + clinical patterns

global_threshold: 0.35

safe_fields:
  - sdoh_domain
  - sdoh_score
  - risk_level
  - protocol_id
  - loinc_code
  - snomed_code
  - icd10_code
  - claim_id
  - encounter_type

blocked_fields:
  - patient_name
  - first_name
  - last_name
  - date_of_birth
  - dob
  - mrn
  - medical_record_number
  - ssn
  - social_security
  - phone
  - fax
  - email
  - address
  - zip_code
  - account_number
  - health_plan_number
  - device_identifier
  - ip_address
  - url

patterns:
  # Names — capitalized word sequences (conservative: 2+ capitalized words)
  full_name: '\b[A-Z][a-z]+\s+[A-Z][a-z]+\b'
  # Dates below year granularity (MM/DD/YYYY, MM-DD-YYYY, YYYY-MM-DD with day)
  date_with_day: '\b(?:0?[1-9]|1[0-2])[/-](?:0?[1-9]|[12]\d|3[01])[/-]\d{4}\b|\b\d{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12]\d|3[01])\b'
  # Phone / fax
  phone: '\b(?:\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}\b'
  # Email
  email: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
  # SSN
  ssn: '\b\d{3}-\d{2}-\d{4}\b'
  # MRN (alphanumeric 6-10 chars preceded by MRN/ID/# label)
  mrn: '(?i)(?:mrn|medical.record|patient.id|#)\s*:?\s*([A-Z0-9]{6,10})\b'
  # Health plan / beneficiary numbers
  health_plan: '(?i)(?:health.plan|beneficiary|member.id|group.id)\s*:?\s*([A-Z0-9]{6,15})\b'
  # IP addresses
  ip_address: '\b(?:\d{1,3}\.){3}\d{1,3}\b'
  # ZIP+4 (geographic below state)
  zip_code: '\b\d{5}(?:-\d{4})?\b'

categorical_placeholders:
  patient: "[PATIENT]"
  date: "[DATE]"
  phone: "[PHONE]"
  email: "[EMAIL]"
  ssn: "[SSN]"
  mrn: "[MRN]"
  address: "[ADDRESS]"

sources:
  fhir:
    threshold: 0.3
    blocked_fields:
      - patient_name
      - date_of_birth
      - mrn
      - address
      - phone
      - email
  sdoh_assessment:
    threshold: 0.35
    blocked_fields:
      - patient_name
      - date_of_birth
  prior_auth:
    threshold: 0.3
    blocked_fields:
      - patient_name
      - date_of_birth
      - ssn
      - health_plan_number
