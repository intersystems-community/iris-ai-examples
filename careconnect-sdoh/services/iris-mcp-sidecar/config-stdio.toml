[mcp]
transport = "stdio"

[[iris]]
name = "careconnect"
server = { host = "localhost", port = 1972, username = "_SYSTEM", password = "SYS" }
pool   = { min = 1, max = 3 }
endpoints = [
  { path = "/mcp/careconnect" },
]
tool_refresh_interval      = "30s"
request_timeout             = "120s"
reconnect_interval         = "10s"
