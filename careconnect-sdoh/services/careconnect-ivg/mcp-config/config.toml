[mcp]
transport = "http"
host      = "0.0.0.0"
port      = 8888

[[iris]]
name                       = "careconnect"
server                     = { host = "localhost", port = 1972, username = "_SYSTEM", password = "SYS" }
pool                       = { min = 1, max = 3 }
tool_refresh_interval      = "30s"
request_timeout             = "120s"
endpoints = [
  { path = "/mcp/careconnect-kg" },
]

[logging]
level  = "info"
output = "stderr"
