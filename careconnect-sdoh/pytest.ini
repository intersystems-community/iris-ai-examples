[pytest]
testpaths = tests evals/tests
pythonpath = . tests src src/CareConnect src/CareConnect/phi_guardian
addopts = -v --tb=short
markers =
    unit: Unit tests — no Docker, no IRIS required
    smoke: Smoke gate — containers healthy, basic connectivity
    contract: Contract gate — FR acceptance scenarios
    e2e: Full E2E gate — requires running Docker stack
    ivg: IVG knowledge graph stack required (--profile ivg)
    docker: Tests requiring running Docker containers
