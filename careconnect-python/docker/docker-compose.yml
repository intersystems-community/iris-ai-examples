services:
  iris:
    build:
      context: ..
      dockerfile: docker/Dockerfile.iris
      args:
        IMAGE: ${IRIS_IMAGE:-intersystemsdc/irishealth-community:2026.2}
    container_name: careconnect-python-iris
    ports:
      - "${IRIS_PORT:-31972}:1972"
      - "${IRIS_WEB_PORT:-31773}:52773"
    healthcheck:
      # The demo patients are loaded into the image at build time, so the
      # superserver accepting connections is all the agent waits for.
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/1972"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
      args:
        IMAGE: ${IRIS_IMAGE:-intersystemsdc/irishealth-community:2026.2}
    container_name: careconnect-python-agent
    depends_on:
      iris:
        condition: service_healthy
    environment:
      - IRIS_HOST=iris
      - IRIS_PORT=1972
      - IRIS_USERNAME=${IRIS_USERNAME:-_SYSTEM}
      - IRIS_PASSWORD=${IRIS_PASSWORD:-SYS}
      - IRIS_NAMESPACE=USER
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    stdin_open: true
    tty: true
    command: ["python", "agent.py"]
