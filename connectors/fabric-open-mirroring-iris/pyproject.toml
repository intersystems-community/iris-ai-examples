[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-open-mirroring-iris"
version = "0.1.0"
description = "Publish InterSystems IRIS tables into a Microsoft Fabric Open Mirroring landing zone."
requires-python = ">=3.10"
dependencies = ["pyarrow>=14.0.0"]

[tool.setuptools.packages.find]
include = ["fabric_open_mirroring_iris*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
