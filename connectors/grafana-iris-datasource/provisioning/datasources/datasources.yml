apiVersion: 1

datasources:
  - name: 'InterSystems IRIS'
    type: 'intersystems-iris-datasource'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    jsonData:
      host: 'iris'
      webPort: 52773
      namespace: 'USER'
      username: '_SYSTEM'
      useHTTPS: false
      skipTLSVerify: false
      timeoutSeconds: 30
    secureJsonData:
      password: 'SYS'
