services:
  iris:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        IMAGE: irishealth-community:2026.2.0AI.162.0
    container_name: kgtickets-iris
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - WIKI_DIR=/app/wiki/
    ports:
      - "1972:1972"
      - "52773:52773"
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/52773"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s

  mcp:
    # Reuses the same built IRIS image — iris-mcp-server binary is included.
    # Runs as a lightweight sidecar: no IRIS process, just the MCP gateway.
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        IMAGE: irishealth-community:2026.2.0AI.162.0
    container_name: kgtickets-mcp
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    # Override entrypoint — do NOT start IRIS, just launch the MCP gateway
    entrypoint: ["/usr/irissys/bin/iris-mcp-server"]
    command: [
      "run",
      "--iris-host", "localhost",
      "--iris-port", "1972",
      "--iris-user", "_SYSTEM",
      "--iris-password", "SYS",
      "--iris-endpoint", "/mcp/kgtickets"
    ]
    # Share iris network so localhost:52773 resolves to the iris container's web server
    network_mode: "service:iris"
    depends_on:
      iris:
        condition: service_healthy
